name = "logistics-double-7"
main = "src/worker.ts"
compatibility_date = "2024-09-02"
account_id = "913e732298e2383df6ec533afd380eea"

[vars]
EMAIL_PROVIDER = "sendgrid"
SENDGRID_API_KEY = "REPLACE_WITH_KEY"
EMAIL_FROM = "no-reply@double7logistics.com"
DAILY_SUMMARY_EMAIL = "admin@example.com"

[build]
command = "npm run build"

[assets]
directory = "out"

[[d1_databases]]
binding = "DB"
database_name = "tracking_db"
database_id = "165e3eb4-9323-413f-be55-cc7846857cd3"

[[d1_databases]]
binding = "USERS_DB"
database_name = "users"
database_id = "6adbc3b5-ed24-48cc-8be2-8244363b650d"

# Enterprise Edge KV Cache (Sub-10ms Tracking & Rate Caches)
[[kv_namespaces]]
binding = "LOGISTICS_CACHE"
id = "fbe236634e3b4516a768338e81028b55"

# Enterprise Workers AI (Intelligent Routing & Customs Assistant)
[ai]
binding = "AI"

send_email = [
  { name = "SEND_EMAIL" }
]



